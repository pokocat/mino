    # ==== mino 运营后台（静态站；与 junshi 无关，仅新增）====
    # https://wxapi.aibuzz.cn/__ADMIN_PATH__/ → 静态文件 __ADMIN_WEB_DIR__；
    # 后台调用的 /api_mino/admin/* 走已有的 /api_mino/ 反代到后端，无需额外配置。
    location = /__ADMIN_PATH__ {
        return 301 /__ADMIN_PATH__/;
    }
    location /__ADMIN_PATH__/ {
        alias __ADMIN_WEB_DIR__/;
        try_files $uri $uri/ /__ADMIN_PATH__/index.html;
    }
