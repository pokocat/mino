    # ==== mino V3 后端（新增；与 junshi 的 /api/ 互不影响）====
    # 小程序请求 https://wxapi.aibuzz.cn/api_mino/<path> → 去掉 /api_mino/ 前缀转发到本机 4100。
    # proxy_pass 末尾带 / ：nginx 用 / 替换掉 location 的 /api_mino/ 前缀，
    # 故 /api_mino/health → 127.0.0.1:4100/health（NestJS 控制器在根路径，无 global prefix）。
    location /api_mino/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE 米诺对话流式：必须关缓冲 + 长超时
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
