name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: server (NestJS + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Prisma 校验 / 生成需要该变量存在（不连真实库）
      DATABASE_URL: postgresql://mino:mino@localhost:5432/mino?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test

  miniprogram:
    name: miniprogram (原生 TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
